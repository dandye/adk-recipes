type: "standalone"   # Options: [standalone | module]
status: "active"     # Options: [active | inactive]
language: "python"   # Options: [python | java | go | kotlin | typescript]
deployable: true
description: "Autonomous Google Security Operations (SecOps) ADK recipe combining Google SecOps OneMCP, progressive SkillToolset runbooks, role-scoped specialist personas, and Google Threat Intelligence (GTI) MCP."

architecture:
  agent: "multi"
  stateful: true
  datasources:
    - "local"
    - "external"

dependencies:
  libraries:
    - "ADK"
  services:
    - "Google Security Operations"
    - "Google Threat Intelligence"
    - "Vertex AI"
    - "Cloud Run"

ownership:
  team: "Google Cloud Security"
  poc: "dandye"

tags:
  - "secops"
  - "security"
  - "mcp"
  - "skills"
  - "multi-agent"
  - "threat-intelligence"

license: "Apache-2.0"
