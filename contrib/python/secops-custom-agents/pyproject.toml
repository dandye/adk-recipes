[project]
name = "secops-custom-agents"
version = "0.1.0"
description = "Autonomous Google Security Operations (SecOps) ADK recipe combining Google SecOps OneMCP, progressive SkillToolset runbooks, role-scoped specialist personas, and Google Threat Intelligence (GTI) MCP."
authors = [{ name = "Dan Dye", email = "dandye@google.com" }]
license = { text = "Apache License 2.0" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk[http-server]>=1.0,<2",
    "aiohttp>=3.13.4",
    "gcsfs>=2024.11.0",
    "google-adk[gcp,mcp,otel-gcp]>=2.6.0,<3.0.0",
    "google-cloud-aiplatform[agent-engines]>=1.156.0,<2.0.0",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Use public PyPI as the default index for this recipe.
[[tool.uv.index]]
url = "https://pypi.org/simple/"
default = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = "."
addopts = "--ignore=tests/integration"

[tool.agent-starter-pack]
base_template = "adk"
description = "Autonomous Google Security Operations (SecOps) ADK recipe combining Google SecOps OneMCP, progressive SkillToolset runbooks, role-scoped specialist personas, and Google Threat Intelligence (GTI) MCP."
example_question = "Triage case 4091 and hunt for Ursnif activity across the last 7 days."

[tool.agent-starter-pack.settings]
name = "secops-custom-agents"
agent_directory = "app"
deployment_targets = ["agent_engine", "cloud_run"]
interactive_command = "setup-infra && make playground"
